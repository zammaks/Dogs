version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-dogs_db}
      POSTGRES_USER: ${DB_USER:-dogs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dogs-network
    restart: unless-stopped

  # Redis для Celery и кэширования
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - dogs-network
    restart: unless-stopped

  # Django Backend
  backend:
    build: .
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME:-dogs_db}
      - DB_USER=${DB_USER:-dogs_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SOCIAL_AUTH_YANDEX_OAUTH2_KEY=${SOCIAL_AUTH_YANDEX_OAUTH2_KEY}
      - SOCIAL_AUTH_YANDEX_OAUTH2_SECRET=${SOCIAL_AUTH_YANDEX_OAUTH2_SECRET}
      - SOCIAL_AUTH_LOGIN_REDIRECT_URL=${SOCIAL_AUTH_LOGIN_REDIRECT_URL}
      - SOCIAL_AUTH_LOGIN_ERROR_URL=${SOCIAL_AUTH_LOGIN_ERROR_URL}
      - SOCIAL_AUTH_YANDEX_OAUTH2_REDIRECT_URI=${SOCIAL_AUTH_YANDEX_OAUTH2_REDIRECT_URI}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - STATIC_ROOT=${STATIC_ROOT:-/app/staticfiles}
      - MEDIA_ROOT=${MEDIA_ROOT:-/app/media}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - dogs-network
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 dogs.wsgi:application"

  # Celery Worker
  celery:
    build: .
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME:-dogs_db}
      - DB_USER=${DB_USER:-dogs_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_files:/app/media
      - logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - dogs-network
    restart: unless-stopped
    command: celery -A dogs worker -l info

  # Celery Beat (планировщик задач)
  celery-beat:
    build: .
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME:-dogs_db}
      - DB_USER=${DB_USER:-dogs_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_files:/app/media
      - logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - dogs-network
    restart: unless-stopped
    command: celery -A dogs beat -l info

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dogs-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - static_files:/var/www/static
      - media_files:/var/www/media
    depends_on:
      - backend
      - frontend
    networks:
      - dogs-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  logs:

networks:
  dogs-network:
    driver: bridge 